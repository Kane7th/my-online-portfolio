# Add inside your staging.mysmartrental.com server { } block.
# Reload: sudo nginx -t && sudo systemctl reload nginx
#
# If Next.js runs on 127.0.0.1:3000, keep proxy_pass as below.
# Adjust the port if your app uses PM2 on another port.

location = /api/health {
    # CORS preflight from GitHub Pages portfolio
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://kane7th.github.io" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }

    add_header Access-Control-Allow-Origin "https://kane7th.github.io" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Vary "Origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
}
